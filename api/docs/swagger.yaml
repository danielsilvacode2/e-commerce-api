info:
  contact: {}
  description: API REST de E-Commerce com autenticacao via cookie HTTP-Only (JWT),
    gestao de usuarios, produtos, carrinho, pedidos, pagamentos (Pix e Cartao via
    Mercado Pago) e assistente de chat.
  title: E-Commerce API
  version: "1.0"
paths:
  /cart:
    get:
      description: Retorna o carrinho e todos os itens adicionados pelo usuario logado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SwaggerDataResponse-dto_CartResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Listar itens do carrinho
      tags:
      - Cart
    post:
      consumes:
      - application/json
      description: Adiciona um produto (ou incrementa sua quantidade) no carrinho
        do usuario logado.
      parameters:
      - description: Produto e quantidade
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CartRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.SwaggerValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Adicionar produto ao carrinho
      tags:
      - Cart
    put:
      consumes:
      - application/json
      description: Atualiza o estado de selecao de todos os itens no carrinho do usuario
        logado.
      parameters:
      - description: Estado de selecao
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.IsSelectRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: Selecao atualizada com sucesso
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Selecionar/desmarcar todos os itens do carrinho
      tags:
      - Cart
  /cart/{id}:
    delete:
      description: Remove um produto do carrinho do usuario logado.
      parameters:
      - description: ID do item no carrinho (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Item removido com sucesso
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Remover item do carrinho
      tags:
      - Cart
    put:
      consumes:
      - application/json
      description: Atualiza o estado de selecao de um item especifico no carrinho
        para o checkout.
      parameters:
      - description: ID do item no carrinho (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Estado de selecao
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.IsSelectRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: Selecao atualizada com sucesso
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Selecionar/desmarcar item do carrinho
      tags:
      - Cart
  /cart/decrease/{id}:
    put:
      consumes:
      - application/json
      description: Reduz a quantidade de um item especifico no carrinho do usuario
        logado.
      parameters:
      - description: ID do item no carrinho (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Quantidade a reduzir
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CartRequestDecreaseDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Diminuir quantidade de item no carrinho
      tags:
      - Cart
  /chat:
    post:
      consumes:
      - application/json
      description: Envia uma mensagem do usuario autenticado para o chatbot (OpenRouter
        / Gemini 2.5 Flash Lite) e retorna a resposta gerada.
      parameters:
      - description: Mensagem do usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChatRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SwaggerDataResponse-dto_ChatResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.SwaggerValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Enviar mensagem ao assistente
      tags:
      - Chat
  /login:
    post:
      consumes:
      - application/json
      description: Autentica um usuario verificado por email e senha e define o cookie
        HTTP-Only "token" (JWT valido por 2 horas).
      parameters:
      - description: Credenciais de acesso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SwaggerDataResponse-dto_LoginResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      summary: Realizar login
      tags:
      - Auth
  /logout:
    post:
      description: Revoga o JWT atual (se presente e valido) e remove o cookie HTTP-Only
        "token".
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      summary: Realizar logout
      tags:
      - Auth
  /orders:
    get:
      description: Retorna todos os pedidos com suporte a paginacao e filtros por
        status e user_id. Requer perfil admin.
      parameters:
      - default: 1
        description: Numero da pagina
        in: query
        name: page
        type: integer
      - default: 10
        description: Itens por pagina
        in: query
        name: limit
        type: integer
      - description: Filtro por status
        in: query
        name: status
        type: string
      - description: Filtro por ID do usuario (UUID)
        in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SwaggerDataResponse-dto_PaginatedOrdersDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Listar todos os pedidos (admin)
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Cria um novo pedido a partir dos itens selecionados no carrinho
        do usuario logado.
      parameters:
      - description: Dados para criacao do pedido (CEP)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OrderCreateRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helpers.SwaggerDataResponse-dto_OrderResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.SwaggerValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Criar pedido (checkout)
      tags:
      - Orders
  /orders/{id}:
    delete:
      description: Exclui um pedido pelo ID. Requer perfil admin.
      parameters:
      - description: ID do pedido (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Pedido removido com sucesso
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
      security:
      - CookieAuth: []
      summary: Remover pedido (admin)
      tags:
      - Orders
    get:
      description: Retorna os detalhes de um pedido especifico (proprietario ou admin).
      parameters:
      - description: ID do pedido (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SwaggerDataResponse-dto_OrderResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerMessageResponse'
